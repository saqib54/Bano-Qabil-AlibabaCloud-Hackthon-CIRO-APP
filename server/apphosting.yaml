# Firebase App Hosting configuration for the CIRO backend API.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  # Free hackathon tier: scale to zero when idle, single instance
  # (SQLite is local to the instance by design).
  minInstances: 0
  maxInstances: 1
  concurrency: 80

